name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Set up Python for homepage media
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install media tools
        run: pip install Pillow imageio-ffmpeg
      - name: Optimize homepage media
        run: python scripts/optimize_home_media.py
      - name: Save optimized media for all publishing paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos/optimized assets/images/about/*.webp assets/images/hero.jpg assets/images/placeholders/specials-poster.webp
          if ! git diff --cached --quiet; then
            git commit -m "chore: save optimized homepage media"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build site
        run: npm run build
      - name: Remove dependencies
        run: rm -rf node_modules
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

