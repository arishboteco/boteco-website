name: Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Set up Python for homepage media
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install media tools
        run: pip install Pillow imageio-ffmpeg
      - name: Optimize homepage media
        run: python scripts/optimize_home_media.py
      - name: Build site
        run: npm run build
      - name: Remove dependencies
        run: rm -rf node_modules
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

